# Example: ServiceNow DevOps Sonar with HTTPS Proxy Support
#
# This workflow demonstrates how to route the ServiceNow DevOps Sonar action
# through a corporate HTTPS proxy. The action reads the HTTPS_PROXY environment
# variable and tunnels all requests via HTTP CONNECT.
#
# Required secrets:
#   HTTPS_PROXY_URL           - Proxy URL, e.g. http://<host>:<port> or http://user:pass@<host>:<port>
#   SN_INSTANCE_URL           - ServiceNow instance URL
#   SN_DEVOPS_INTEGRATION_TOKEN - DevOps integration token
#   SN_ORCHESTRATION_TOOL_ID  - Orchestration tool sys_id
#   SONAR_HOST_URL            - SonarQube/SonarCloud host URL
#   SONAR_PROJECT_KEY         - Sonar project key

name: Proxy Test - DevOps Sonar

on:
  workflow_dispatch:

jobs:

  sonar:
    name: ServiceNow Sonar
    runs-on: ubuntu-latest

    # Set HTTPS_PROXY so the action routes traffic through your proxy
    env:
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY_URL }}

    steps:
      - name: ServiceNow Sonar
        uses: ServiceNow/servicenow-devops-sonar@feature/https-proxy-agent
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow Sonar'
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-project-key: ${{ secrets.SONAR_PROJECT_KEY }}
